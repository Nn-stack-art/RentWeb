<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租房系统 - 登录/注册</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <!-- 登录标题 -->
        <h2 class="login-title" id="formTitle">
            <i class="fa fa-home"></i>租房系统登录
        </h2>

<!--        &lt;!&ndash; 错误提示 &ndash;&gt;-->
<!--        <div class="error-msg" style="display: none;" id="errorMsg">-->
<!--            用户名或密码错误-->
<!--        </div>-->
        <!-- 在登录表单上方添加 -->
        <div th:if="${param.error}" class="alert alert-danger">
            用户名或密码错误，请重试！
        </div>
        
        <!-- 成功提示 -->
        <div class="success-msg" id="successMsg" style="display: none;">
            注册成功！请登录。
        </div>


        <!-- 登录表单 -->
        <form id="loginForm" action="/user/doLogin" method="post">
            <!-- 用户名输入框 -->
            <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-user"></i>
                    </span>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
            </div>

            <!-- 密码输入框 -->
            <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-lock"></i>
                    </span>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn btn-submit">
                <i class="fa fa-sign-in mr-2"></i>登录
            </button>

            <div class="form-check mb-3" style="margin-left: 8px;">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe" value="true">
                    记住我
                </label>
            </div>
        </form>
        
        <!-- 注册表单 -->
        <form id="registerForm" action="/user/register" method="post">
            <!-- 用户名输入框 -->
            <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-user"></i>
                    </span>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名(3-20字符)" required minlength="3" maxlength="20">
            </div>

            <!-- 密码输入框 -->
            <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-lock"></i>
                    </span>
                <input type="password" name="passwd" class="form-control" placeholder="请输入密码(6-20字符)" required minlength="6" maxlength="20">
            </div>

            <!-- 注册按钮 -->
            <button type="submit" class="btn btn-submit">
                <i class="fa fa-user-plus mr-2"></i>注册
            </button>
        </form>
        
        <!-- 切换链接 -->
        <div class="switch-link">
            <span id="switchText">还没有账号？</span>
            <a id="switchLink">立即注册</a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="/js/auth.js"></script>
</body>
</html>
