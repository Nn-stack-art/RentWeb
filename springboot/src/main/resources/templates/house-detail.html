<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房源详情 - 广州租房</title>
    <!-- 引入外部依赖（Bootstrap + 图标库） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- 引入独立 CSS 文件（关键） -->
    <link rel="stylesheet" href="/css/house-detail.css">
</head>
<body>
<div class="container">
    <div class="house-detail-container">
        <!-- 房源标题 -->
        <h2 class="house-title" id="houseTitle">加载中...</h2>

        <!-- 价格 -->
        <div class="house-price">
            <span id="housePrice">--</span> 元/月
        </div>

        <!-- 核心元数据 -->
        <div class="house-meta">
            <div class="meta-item">
                <i class="bi bi-geo-alt"></i>
                <span id="houseArea">未知地区</span>
            </div>
            <div class="meta-item">
                <i class="bi bi-building"></i>
                <span id="houseRoomType">未知房型</span>
            </div>
            <div class="meta-item">
                <i class="bi bi-ruler-combined"></i>
                <span id="houseSquare">0</span> ㎡
            </div>
            <div class="meta-item">
                <i class="bi bi-compass"></i>
                <span id="housePosition">未知朝向</span>
            </div>
            <div class="meta-item">
                <i class="bi bi-map-marker"></i>
                <span id="houseDetailPlace">未知地址</span>
            </div>
        </div>

        <!-- 详细信息 -->
        <div class="house-info">
            <div class="mb-3">
                <span class="house-label">房源标题：</span>
                <span class="house-value" id="houseTitleDetail">未知房源</span>
            </div>
            <div class="mb-3">
                <span class="house-label">所在地区：</span>
                <span class="house-value" id="houseAreaDetail">未知</span>
            </div>
            <div class="mb-3">
                <span class="house-label">详细地址：</span>
                <span class="house-value" id="houseDetailPlaceDetail">未知</span>
            </div>
            <div class="mb-3">
                <span class="house-label">房屋面积：</span>
                <span class="house-value" id="houseSquareDetail">0 ㎡</span>
            </div>
            <div class="mb-3">
                <span class="house-label">房屋朝向：</span>
                <span class="house-value" id="housePositionDetail">未知</span>
            </div>
            <div class="mb-3">
                <span class="house-label">房屋房型：</span>
                <span class="house-value" id="houseRoomTypeDetail">未知</span>
            </div>
            <div class="mb-3">
                <span class="house-label">月租价格：</span>
                <span class="house-value" id="housePriceDetail">-- 元/月</span>
            </div>
            <div class="mb-3">
                <span class="house-label">收藏状态：</span>
                <span class="house-value" id="houseCollected">未收藏</span>
            </div>
        </div>

        <!-- 功能按钮（调整为右对齐分组） -->
        <div class="btn-group">
            <button class="btn back-btn" onclick="window.history.back()">
                <i class="bi bi-arrow-left"></i> 返回房源列表
            </button>
            <button class="btn collect-btn" id="collectBtn">
                <i class="bi bi-heart"></i> 收藏房源
            </button>
        </div>
    </div>
</div>

<!-- 引入外部依赖（jQuery） -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
<!-- 引入独立 JS 文件（关键） -->
<script src="/js/house-detail.js"></script>
</body>
</html>
