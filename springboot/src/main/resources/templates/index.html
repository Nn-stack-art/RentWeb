<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租房系统 - 首页</title>
    <!-- 1. 静态引入百度地图传统版API（解决异步加载安全限制） -->
    <script src="https://api.map.baidu.com/api?v=3.0&ak=WtHVYsMMiGhr05j9Wyk6PkXP12O09UaW"></script>
    <!-- 2. 静态引入热力图插件（依赖上面的BMap） -->
    <script src="https://api.map.baidu.com/library/Heatmap/2.0/src/Heatmap_min.js"></script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- ECharts 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- ECharts 热力图扩展（按需引入） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/extension/heatmap.min.js"></script>
    <!-- ECharts 地图扩展（热力图如果基于地图，需引入） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <!-- 顶部状态栏 -->
    <nav class="navbar navbar-top navbar-light">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-md-none" id="sidebarToggle">
                    <i class="fa fa-bars"></i>
                </button>
                <span class="navbar-brand mb-0 h1 ms-2">租房系统</span>
            </div>

            <div sec:authorize="isAuthenticated()">
                <span class="meta-3"  sec:authorize="hasRole('ADMIN')">管理员</span>
                <span class="me-3">
                <i class="fa fa-user me-1"></i>
                <span sec:authentication="name"></span>  <!-- 直接获取用户名 -->
                </span>
                <!-- 改为表单 -->
                <form th:action="@{/user/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="fa fa-sign-out"></i> 登出
                    </button>
                </form>
            </div>

        </div>
    </nav>
    
    <!-- 侧边栏导航 -->
    <div class="sidebar">
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-target="home">
                    <i class="fa fa-home"></i>
                    <span>首页</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-target="data-analysis">
                    <i class="fa fa-bar-chart"></i>
                    <span>数据解析</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-target="profile">
                    <i class="fa fa-user"></i>
                    <span>我的</span>
                </a>
            </li>
        </ul>
    </div>
    
    <!-- 主内容区域 -->
    <div class="main-content">
        <!-- 首页内容 - 房源筛选 -->
        <div id="home" class="content-section">
            <h2 class="mb-4">房源筛选</h2>
            
            <!-- 筛选表单 -->
            <form id="houseFilterForm" class="mb-4">
                <div class="row">
                    <!-- 地区筛选 -->
                    <div class="col-md-6 col-lg-3 mb-3">
                        <label class="form-label">地区</label>
                        <select class="form-select" id="regionSelect">
                            <option value="">请选择地区</option>
                            <option value="越秀">越秀区</option>
                            <option value="荔湾">荔湾区</option>
                            <option value="海珠">海珠区</option>
                            <option value="天河">天河区</option>
                            <option value="白云">白云区</option>
                            <option value="黄埔">黄埔区</option>
                            <option value="番禺">番禺区</option>
                            <option value="花都">花都区</option>
                            <option value="南沙">南沙区</option>
                            <option value="增城">增城区</option>
                            <option value="从化">从化区</option>
                        </select>
                    </div>
                    
                    <!-- 价格区间 -->
                    <div class="col-md-6 col-lg-3 mb-3">
                        <label class="form-label">价格区间</label>
                        <div class="input-group">
                            <input type="number" class="form-control" placeholder="最低价" id="minPrice" min="1">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" placeholder="最高价" id="maxPrice" min="1">
                        </div>
                    </div>
                    
                    <!-- 房型 -->
                    <div class="col-md-6 col-lg-3 mb-3">
                        <label class="form-label">房型</label>
                        <select class="form-select" id="houseTypeSelect">
                            <option value="">请选择房型</option>
                            <option value="1室">一室</option>
                            <option value="2室">两室</option>
                            <option value="3室">三室</option>
                            <option value="4室">四室+</option>

                        </select>
                    </div>
                    
                    <!-- 朝向 -->
                    <div class="col-md-6 col-lg-3 mb-3">
                        <label class="form-label">朝向</label>
                        <select class="form-select" id="orientationSelect">
                            <option value="">请选择朝向</option>
                            <option value="东">东</option>
                            <option value="南">南</option>
                            <option value="西">西</option>
                            <option value="北">北</option>
                        </select>
                    </div>
                    
                    <!-- 搜索按钮 -->
                    <div class="col-md-6 col-lg-3 mb-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fa fa-search me-1"></i>搜索
                        </button>
                    </div>
                </div>
            </form>
            
            <!-- 筛选结果区域 -->
            <div id="filterResults">
                <h3 class="mb-3">房源列表</h3>
                <div class="alert alert-info">
                    请选择筛选条件并点击搜索按钮查找房源。
                </div>
                <!-- 房源列表将在这里显示 -->
            </div>
        </div>
        
        <!-- 数据解析内容 -->
        <!-- 数据解析内容 -->

        <div id="data-analysis" class="content-section" style="display: none;">
            <!-- 页面标题 + 筛选栏 -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-5">
                <h2 class="mb-0">
                    <i class="fa fa-bar-chart text-primary me-2"></i>房源数据解析
                </h2>
                <!-- 数据维度筛选 -->
                <div class="d-flex gap-3 mt-2 mt-md-0">
                    <select class="form-select w-auto" id="dataDimension">
                        <option value="price">价格维度</option>
                        <option value="region">区域维度</option>
                        <option value="type">房型维度</option>
                        <option value="orientation">朝向维度</option>
                    </select>
                    <button class="btn btn-outline-primary" id="refreshChart">
                        <i class="fa fa-refresh me-1"></i>刷新数据
                    </button>
                </div>
            </div>

            <!-- 图表区域：响应式网格布局（移除折线图，调整热力图位置） -->
            <div class="row g-4">
                <!-- 1. 柱状图（区域/价格分布）- 占2/3宽度 -->
                <div class="col-12 col-lg-8">
                    <div class="card h-100">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fa fa-bar-chart-o me-1"></i>房源价格/区域分布
                            </h5>
                            <small class="text-muted">全量数据</small>
                        </div>
                        <div class="card-body">
                            <div id="barChart" style="width: 100%; height: 400px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 2. 饼图（房型占比）- 占1/3宽度 -->
                <div class="col-12 col-lg-4">
                    <div class="card h-100">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fa fa-pie-chart me-1"></i>房型占比分布
                            </h5>
                            <small class="text-muted">全量数据</small>
                        </div>
                        <div class="card-body">
                            <div id="pieChart" style="width: 100%; height: 400px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 3. 百度地图热力图（占100%宽度，替代原折线图位置） -->
                <div class="col-12">
                    <div class="card h-100">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fa fa-map-marker me-1"></i>区域房源热力图
                            </h5>
                            <small class="text-muted">按房源数量</small>
                        </div>
                        <div class="card-body">
                            <!-- 百度地图容器 -->
                            <div id="baiduMap" style="width: 100%; height: 400px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据说明（可选） -->
            <div class="mt-4 alert alert-light border">
                <i class="fa fa-info-circle me-1"></i>
                <small class="text-muted">
                    数据说明：图表数据基于平台近3个月租房信息统计，热力图颜色越深代表该区域房源数量越多，价格趋势图展示各区域均价变化。
                </small>
            </div>
        </div>

        <!-- 个人中心内容 -->
        <div id="profile" class="content-section" style="display: none; padding: 20px 0;">
            <!-- 我的收藏模块 - 优化版 -->
            <div class="my-collections">
                <!-- 标题栏（带分割线和图标，更醒目） -->
                <div class="d-flex align-items-center justify-content-between mb-6 pb-3 border-bottom border-secondary-subtle">
                    <h3 class="mb-0 fw-bold text-dark">
                        <i class="fa fa-heart text-danger me-2" style="margin-left: 20px"></i> 我的收藏
                    </h3>
                    <span class="text-muted small" style="margin-right: 20px">
                <i class="fa fa-clock-o me-1" ></i> 收藏的房源会保存在这里
            </span>
                </div>

                <!-- 收藏列表容器（优化间距和响应式） -->
                <div class="row g-4" id="collectedHousesList" style="margin-top: 2px;">
                    <!-- 加载中提示（优化动画和样式） -->
                    <div class="col-12 text-center py-10" id="collectionLoading">
                        <div class="d-inline-block p-4 bg-light rounded-circle mb-3">
                            <i class="fa fa-spinner fa-spin text-primary" style="font-size: 2.5rem;"></i>
                        </div>
                        <p class="mt-2 text-muted fs-6">加载收藏房源中...</p>
                    </div>

                    <!-- 无收藏提示（优化图标大小和按钮样式） -->
                    <div class="col-12 text-center py-10 d-none" id="noCollections">
                        <div class="d-inline-block p-5 bg-light rounded-circle mb-4">
                            <i class="fa fa-heart-o text-secondary" style="font-size: 4rem;"></i>
                        </div>
                        <p class="mt-3 fs-5 text-dark">暂无收藏房源</p>
                        <p class="text-muted mb-4">快去收藏喜欢的房子，随时查看～</p>
                        <a href="#" class="btn btn-primary btn-lg px-5" data-target="home">
                            <i class="fa fa-search me-1"></i> 去浏览房源
                        </a>
                    </div>

                    <!-- 收藏房源卡片会动态渲染到这里 -->
                </div>
            </div>

        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/index.js}"></script>
    <!-- 筛选功能 JS -->
    <script th:src="@{/js/house-filter.js}"></script>
    <!-- 数据解析 -->
    <script th:src="@{/js/data-analysis.js}"></script>
</body>
</html>
